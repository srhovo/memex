<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>码单器内置记忆库 v8.2</title>
<style>
  :root {
    --bg:#edf3f8;
    --card:#ffffff;
    --line:#d7e1ec;
    --text:#26384a;
    --muted:#7a8998;
    --brand:#4f74a8;
    --brand-dark:#365777;
    --ok:#31c777;
    --radius:18px;
    --shadow:0 12px 28px rgba(34, 52, 72, .12);
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; background:linear-gradient(180deg,#f4f8fb 0%,var(--bg) 100%); color:var(--text); }
  .wrap { max-width:760px; margin:0 auto; }
  .hero { border-radius:22px; padding:24px 18px; color:#fff; text-align:center; background:linear-gradient(135deg,#4f74a8,#253b52); box-shadow:var(--shadow); }
  .hero h1 { margin:0; font-size:28px; letter-spacing:.5px; }
  .card { margin-top:14px; padding:16px; border:1px solid var(--line); border-radius:var(--radius); background:var(--card); box-shadow:0 8px 20px rgba(42,61,82,.06); }
  .title { margin:0 0 10px; font-size:18px; font-weight:800; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:12px; }
  .stat { border:1px solid var(--line); border-radius:14px; padding:13px 10px; background:#f8fbfe; text-align:center; }
  .stat b { display:block; font-size:23px; color:var(--brand-dark); }
  .stat span { display:block; margin-top:2px; color:var(--muted); font-size:13px; }
  .actions { display:grid; gap:10px; margin-top:14px; }
  button, a.btn { width:100%; border:0; border-radius:16px; padding:14px 12px; font-size:16px; font-weight:800; text-align:center; text-decoration:none; cursor:pointer; }
  .primary { color:#fff; background:linear-gradient(135deg,var(--brand),var(--brand-dark)); }
  .secondary { color:var(--text); background:#fff; border:1px solid var(--line); }
  .success { color:#fff; background:var(--ok); }
  .hint { margin-top:10px; padding:12px; border-radius:14px; background:#f5f8fb; color:var(--muted); font-size:13px; line-height:1.7; }
  .steps { margin:0; padding-left:20px; line-height:1.9; color:var(--text); font-size:14px; }
  .status { min-height:20px; margin-top:10px; color:var(--brand-dark); font-size:14px; font-weight:700; text-align:center; }
  textarea { width:100%; min-height:180px; margin-top:10px; padding:12px; border:1px solid var(--line); border-radius:14px; background:#fbfdff; color:#34465a; font-size:12px; line-height:1.5; resize:vertical; }
  .hidden { display:none; }
  @media (max-width:560px) {
    body { padding:12px; }
    .hero h1 { font-size:24px; }
    .grid { grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <h1>码单器内置记忆库</h1>
  </section>

  <section class="card">
    <h2 class="title">内置数据</h2>
    <div class="grid">
      <div class="stat"><b>143</b><span>陪玩名单</span></div>
      <div class="stat"><b>26</b><span>老板记忆库</span></div>
      <div class="stat"><b>105</b><span>单价记忆库</span></div>
    </div>
    <div class="actions">
      <button class="primary" id="copyBackupBtn">复制记忆库备份</button>
      <button class="secondary" id="downloadBackupBtn">下载 JSON 文件</button>
      <a class="btn success" id="openMainBtn" href="https://srhovo.github.io/madan/">打开码单器页面</a>
      <button class="secondary" id="toggleTextBtn">显示 / 隐藏备份文本</button>
    </div>
    <div class="status" id="statusText"></div>
    <textarea id="backupText" class="hidden" readonly></textarea>
  </section>

  <section class="card">
    <h2 class="title">推荐使用流程</h2>
    <ol class="steps">
      <li>点击「复制记忆库备份」。</li>
      <li>打开码单器页面。</li>
      <li>进入「数据备份」→「导入数据」。</li>
      <li>粘贴备份内容，选择「合并导入」。</li>
      <li>确认预览无误后导入。</li>
    </ol>
    <div class="hint">说明：本页是 APK 内置本地记忆库，不直接改码单器页面数据。这样可以避免跨链接存储隔离导致误写，也方便主程序在线更新。</div>
  </section>
</div>

<script>
(function() {
  const statusText = document.getElementById('statusText');
  const textBox = document.getElementById('backupText');
  const backup = JSON.parse(document.getElementById('embeddedBackup').textContent);
  const payload = JSON.stringify(backup, null, 2);
  const filename = '码单器内置记忆库_v8.2.json';

  textBox.value = payload;

  function setStatus(message) {
    statusText.textContent = message || '';
    clearTimeout(setStatus.timer);
    if (message) setStatus.timer = setTimeout(() => { statusText.textContent = ''; }, 2600);
  }

  async function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
    textBox.classList.remove('hidden');
    textBox.focus();
    textBox.select();
    const ok = document.execCommand('copy');
    window.getSelection && window.getSelection().removeAllRanges();
    if (!ok) throw new Error('copy failed');
    return true;
  }

  document.getElementById('copyBackupBtn').addEventListener('click', async () => {
    try {
      await copyText(payload);
      setStatus('已复制，可到码单器导入页粘贴');
    } catch (error) {
      textBox.classList.remove('hidden');
      setStatus('自动复制失败，请长按文本手动复制');
    }
  });

  document.getElementById('downloadBackupBtn').addEventListener('click', () => {
    const blob = new Blob([payload], { type: 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    setStatus('已触发下载');
  });

  document.getElementById('toggleTextBtn').addEventListener('click', () => {
    textBox.classList.toggle('hidden');
    if (!textBox.classList.contains('hidden')) textBox.focus();
  });
})();
</script>
